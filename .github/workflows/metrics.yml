name: GitHub metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Core metrics — stats, languages, activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: mohammed-salah-zidane
          template: classic
          filename: metrics.core.svg
          output_action: none
          config_timezone: Africa/Cairo
          config_octicons: yes
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          plugins_errors_fatal: no

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_categories: programming, markup
          plugin_languages_ignored: html, css, makefile, shell, jupyter notebook, tex, dockerfile
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_sections: most-used

          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4

          plugin_topics: yes
          plugin_topics_mode: starred
          plugin_topics_sort: stars
          plugin_topics_limit: 10

      - name: Achievements + isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: mohammed-salah-zidane
          template: classic
          filename: metrics.achievements.svg
          output_action: none
          base: ""
          plugins_errors_fatal: no

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0

      - name: Move SVGs into dist
        run: |
          mkdir -p dist
          [ -f metrics.core.svg ] && cp metrics.core.svg dist/
          [ -f metrics.achievements.svg ] && cp metrics.achievements.svg dist/
          ls -la dist/

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          commit_message: "chore(metrics): regenerate metrics SVGs"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
